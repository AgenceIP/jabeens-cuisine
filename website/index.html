<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('theme')
          if (q === 'light' || q === 'dark') sessionStorage.setItem('theme', q)
          var t = sessionStorage.getItem('theme')
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
          // pages are prerendered in French: hide that copy until React shows the English one
          if (localStorage.getItem('lang') === 'en') document.documentElement.setAttribute('data-prerender', 'hide')
        } catch (e) {}
      })()
    </script>
